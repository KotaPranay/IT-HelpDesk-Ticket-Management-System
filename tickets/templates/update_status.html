<!DOCTYPE html>
<html>
<head>
    <title>Update Ticket Status</title>
</head>

<body>

    <h1>Update Ticket Status</h1>

    <p>
        <strong>Title:</strong>
        {{ ticket.title }}
    </p>

    <form method="POST">
        {% csrf_token %}

        <label>Status:</label>

        <select name="status">

            <option value="Open"
                {% if ticket.status == "Open" %}selected{% endif %}>
                Open
            </option>

            <option value="In Progress"
                {% if ticket.status == "In Progress" %}selected{% endif %}>
                In Progress
            </option>

            <option value="Closed"
                {% if ticket.status == "Closed" %}selected{% endif %}>
                Closed
            </option>

        </select>

        <br><br>

        <button type="submit">
            Update Status
        </button>

    </form>

    <br>

    <a href="{% url 'dashboard' %}">
        Back to Dashboard
    </a>

</body>
</html>
